<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Before and after: phantom tables on a noisy scan</title>
<desc id="d">Before: the engine invents a table out of scanner noise. After: the same noisy page produces no table; the page is reported instead of guessed.</desc>
<rect width="1200" height="560" fill="#282B33"/>
<g stroke="#3B587C" stroke-width="0.5" opacity="0.35">
<path d="M0 80H1200M0 200H1200M0 320H1200M0 440H1200M120 0V560M300 0V560M480 0V560M660 0V560M840 0V560M1020 0V560"/>
</g>
<text x="70" y="52" font-family="Menlo,monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#E8836F">BEFORE — THE CONFIDENT LIAR</text>
<text x="640" y="52" font-family="Menlo,monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD49B">AFTER — THE HONEST READER</text>
<!-- left: noisy page with fabricated table -->
<rect x="70" y="80" width="420" height="400" fill="#F2EFE9" rx="3"/>
<g fill="#8a8a84" opacity="0.75">
<circle cx="120" cy="120" r="1.6"/><circle cx="180" cy="105" r="1.2"/><circle cx="260" cy="132" r="1.8"/><circle cx="330" cy="112" r="1.1"/><circle cx="410" cy="126" r="1.5"/><circle cx="98" cy="170" r="1.3"/><circle cx="450" cy="160" r="1.7"/><circle cx="150" cy="440" r="1.4"/><circle cx="240" cy="452" r="1.8"/><circle cx="365" cy="438" r="1.2"/><circle cx="430" cy="455" r="1.6"/><circle cx="105" cy="405" r="1.1"/>
<rect x="110" y="150" width="90" height="3" rx="1.5" opacity="0.5"/><rect x="230" y="163" width="60" height="3" rx="1.5" opacity="0.4"/><rect x="320" y="148" width="110" height="3" rx="1.5" opacity="0.45"/><rect x="120" y="415" width="130" height="3" rx="1.5" opacity="0.4"/><rect x="300" y="425" width="80" height="3" rx="1.5" opacity="0.5"/>
</g>
<!-- fabricated table -->
<g stroke="#C33B2F" stroke-width="1.6" fill="none">
<rect x="120" y="205" width="320" height="150"/>
<path d="M120 242H440M120 280H440M120 318H440M226 205V355M333 205V355"/>
</g>
<g font-family="Menlo,monospace" font-size="13" fill="#C33B2F">
<text x="138" y="230">347.20</text><text x="244" y="230">88.1</text><text x="351" y="230">12,04</text>
<text x="138" y="268">9.315</text><text x="244" y="268">?0.4</text><text x="351" y="268">771</text>
<text x="138" y="306">1.088</text><text x="244" y="306">63</text><text x="351" y="306">4,410</text>
<text x="138" y="344">220,9</text><text x="244" y="344">5.5</text><text x="351" y="344">08.62</text>
</g>
<line x1="120" y1="205" x2="440" y2="355" stroke="#C33B2F" stroke-width="2.5"/>
<line x1="440" y1="205" x2="120" y2="355" stroke="#C33B2F" stroke-width="2.5"/>
<text x="70" y="516" font-family="Menlo,monospace" font-size="13.5" fill="#E8836F">A "table" assembled from smudges. Every number is fiction.</text>
<!-- right: same page, honest result -->
<rect x="640" y="80" width="420" height="400" fill="#F2EFE9" rx="3"/>
<g fill="#8a8a84" opacity="0.75">
<circle cx="690" cy="120" r="1.6"/><circle cx="750" cy="105" r="1.2"/><circle cx="830" cy="132" r="1.8"/><circle cx="900" cy="112" r="1.1"/><circle cx="980" cy="126" r="1.5"/><circle cx="668" cy="170" r="1.3"/><circle cx="1020" cy="160" r="1.7"/><circle cx="720" cy="440" r="1.4"/><circle cx="810" cy="452" r="1.8"/><circle cx="935" cy="438" r="1.2"/><circle cx="1000" cy="455" r="1.6"/><circle cx="675" cy="405" r="1.1"/>
<rect x="680" y="150" width="90" height="3" rx="1.5" opacity="0.5"/><rect x="800" y="163" width="60" height="3" rx="1.5" opacity="0.4"/><rect x="890" y="148" width="110" height="3" rx="1.5" opacity="0.45"/><rect x="690" y="415" width="130" height="3" rx="1.5" opacity="0.4"/><rect x="870" y="425" width="80" height="3" rx="1.5" opacity="0.5"/>
</g>
<g font-family="Menlo,monospace" font-size="14" fill="#0F6E56">
<rect x="690" y="250" width="320" height="66" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="710" y="278">NO TABLE ON THIS PAGE</text>
<text x="710" y="300">Conversion report: page noted.</text>
</g>
<text x="640" y="516" font-family="Menlo,monospace" font-size="13.5" fill="#8FD49B">Same page. Zero inventions. The gap is visible, not hidden.</text>
</svg>
